name: CI

# Lint once, test on the oldest supported Ruby (gemspec required_ruby_version)
# and the latest stable Ruby. See the wiki page FE-Gem-Development-Good-Practice.
# Replace with the shared verification workflow once it is published.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # Not `make lint`: it runs `rubocop -a`, which would auto-correct
      # offences in CI and pass instead of failing.
      - run: bundle exec rubocop

  test:
    name: Tests (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (gemspec required_ruby_version) and latest stable.
        # Add each new Ruby when it is released (25 December).
        ruby: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  build:
    name: Build gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: gem build lr_common_styles.gemspec
